<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <style>
      text { font-family: Inter, Arial, sans-serif; fill: #162033; }
      .title { font-size: 30px; font-weight: 700; }
      .lane { font-size: 22px; font-weight: 700; }
      .head { font-size: 17px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 12px; fill: #4b5870; }
      .box { fill: #ffffff; stroke: #60708e; stroke-width: 2; rx: 12; }
      .data { fill: #eef5ff; stroke: #3975b7; }
      .model { fill: #f1ecff; stroke: #7653b8; }
      .op { fill: #eaf8f1; stroke: #248664; }
      .decision { fill: #fff4df; stroke: #b97818; }
      .final { fill: #e9f7f8; stroke: #187b86; stroke-width: 3; }
      .arrow { stroke: #40506c; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 7 6; }
      .label { font-size: 12px; fill: #33445f; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#40506c"/>
    </marker>
  </defs>

  <rect width="1600" height="980" fill="#fbfcfe"/>
  <text x="55" y="52" class="title">Proposed pipeline with the six-axis router</text>
  <text x="55" y="80" class="small">Code-faithful data flow: router probabilities are consumed by span weighting, masking, routing, denoiser prompting, and acceptance.</text>

  <rect x="35" y="105" width="1530" height="315" rx="18" fill="#f7f9fc" stroke="#cbd3df" stroke-width="2"/>
  <text x="58" y="140" class="lane">Training</text>

  <rect class="box data" x="65" y="170" width="245" height="105"/>
  <text x="187" y="199" text-anchor="middle" class="head">Accepted paired data</text>
  <text x="187" y="226" text-anchor="middle" class="body">question + clean + corrupted</text>
  <text x="187" y="250" text-anchor="middle" class="body">realized axes + exact spans</text>

  <rect class="box model" x="390" y="155" width="280" height="120"/>
  <text x="530" y="187" text-anchor="middle" class="head">Six-axis router</text>
  <text x="530" y="214" text-anchor="middle" class="body">input: question + candidate response</text>
  <text x="530" y="239" text-anchor="middle" class="body">target: realized-axis vector</text>
  <text x="530" y="261" text-anchor="middle" class="small">output g ∈ [0,1]⁶</text>

  <rect class="box model" x="390" y="305" width="280" height="85"/>
  <text x="530" y="336" text-anchor="middle" class="head">Span scorer</text>
  <text x="530" y="362" text-anchor="middle" class="body">question + source-verified span</text>
  <text x="530" y="383" text-anchor="middle" class="small">unknown labels remain masked</text>

  <rect class="box op" x="770" y="170" width="310" height="120"/>
  <text x="925" y="202" text-anchor="middle" class="head">Risk-tuning examples</text>
  <text x="925" y="230" text-anchor="middle" class="body">SFT response → g + span risks</text>
  <text x="925" y="254" text-anchor="middle" class="body">weighted masking → zₜ</text>
  <text x="925" y="277" text-anchor="middle" class="small">never copy source offsets to new SFT text</text>

  <rect class="box model" x="1180" y="170" width="300" height="120"/>
  <text x="1330" y="202" text-anchor="middle" class="head">Denoiser training</text>
  <text x="1330" y="230" text-anchor="middle" class="body">question + unsafe + SFT + zₜ + g</text>
  <text x="1330" y="254" text-anchor="middle" class="body">target: clean response</text>
  <text x="1330" y="277" text-anchor="middle" class="small">risk-tuned adapter from SFT checkpoint</text>

  <path class="arrow" d="M310 210 H390"/><text x="347" y="199" class="label">row labels</text>
  <path class="arrow" d="M310 250 C345 250 350 348 390 348"/><text x="320" y="315" class="label">exact spans</text>
  <path class="arrow" d="M670 215 H770"/><text x="705" y="203" class="label">g</text>
  <path class="arrow" d="M670 348 C720 348 720 260 770 260"/><text x="690" y="325" class="label">span risks</text>
  <path class="arrow" d="M1080 230 H1180"/>

  <rect x="35" y="445" width="1530" height="495" rx="18" fill="#f7f9fc" stroke="#cbd3df" stroke-width="2"/>
  <text x="58" y="482" class="lane">Inference</text>

  <rect class="box data" x="65" y="525" width="190" height="82"/>
  <text x="160" y="557" text-anchor="middle" class="head">User question</text>
  <text x="160" y="584" text-anchor="middle" class="body">+ unsafe response</text>

  <rect class="box model" x="325" y="525" width="220" height="82"/>
  <text x="435" y="557" text-anchor="middle" class="head">SFT model</text>
  <text x="435" y="584" text-anchor="middle" class="body">candidate response yₛ</text>

  <rect class="box model" x="625" y="495" width="235" height="105"/>
  <text x="742" y="528" text-anchor="middle" class="head">Six-axis router</text>
  <text x="742" y="555" text-anchor="middle" class="body">question + yₛ</text>
  <text x="742" y="579" text-anchor="middle" class="body">g = sigmoid(logits)</text>

  <rect class="box model" x="625" y="635" width="235" height="105"/>
  <text x="742" y="668" text-anchor="middle" class="head">Span scorer</text>
  <text x="742" y="695" text-anchor="middle" class="body">question + each sentence</text>
  <text x="742" y="719" text-anchor="middle" class="body">risk vector rᵢ ∈ [0,1]⁶</text>

  <rect class="box op" x="940" y="545" width="250" height="125"/>
  <text x="1065" y="577" text-anchor="middle" class="head">Weight and mask</text>
  <text x="1065" y="605" text-anchor="middle" class="body">Rᵢ = maxₖ(gₖ × rᵢₖ)</text>
  <text x="1065" y="631" text-anchor="middle" class="body">threshold + ranking → zₜ</text>
  <text x="1065" y="654" text-anchor="middle" class="small">g also enters the denoiser prompt</text>

  <polygon points="1315,525 1450,607 1315,689 1180,607" fill="#fff4df" stroke="#b97818" stroke-width="2"/>
  <text x="1315" y="590" text-anchor="middle" class="head">Call denoiser?</text>
  <text x="1315" y="615" text-anchor="middle" class="body">focus/overall risk</text>
  <text x="1315" y="638" text-anchor="middle" class="small">plus deterministic guards</text>

  <rect class="box model" x="1030" y="760" width="260" height="100"/>
  <text x="1160" y="792" text-anchor="middle" class="head">Risk-tuned denoiser</text>
  <text x="1160" y="820" text-anchor="middle" class="body">question + yₛ + zₜ + g</text>
  <text x="1160" y="844" text-anchor="middle" class="body">candidate yᴅ</text>

  <polygon points="1420,742 1535,810 1420,878 1305,810" fill="#fff4df" stroke="#b97818" stroke-width="2"/>
  <text x="1420" y="794" text-anchor="middle" class="head">Accept yᴅ?</text>
  <text x="1420" y="818" text-anchor="middle" class="body">router + scorer rescore</text>
  <text x="1420" y="841" text-anchor="middle" class="small">risk, focus, quality guards</text>

  <rect class="box final" x="675" y="805" width="235" height="75"/>
  <text x="792" y="837" text-anchor="middle" class="head">Final response</text>
  <text x="792" y="862" text-anchor="middle" class="body">accepted yᴅ or fallback yₛ</text>

  <path class="arrow" d="M255 566 H325"/>
  <path class="arrow" d="M545 550 H625"/><text x="570" y="536" class="label">yₛ</text>
  <path class="arrow" d="M545 585 C580 585 590 687 625 687"/>
  <path class="arrow" d="M860 548 C900 548 900 580 940 580"/><text x="885" y="539" class="label">g</text>
  <path class="arrow" d="M860 687 C900 687 900 635 940 635"/><text x="875" y="681" class="label">rᵢ</text>
  <path class="arrow" d="M1190 607 H1180"/>
  <path class="arrow" d="M1315 689 C1315 725 1240 735 1210 760"/><text x="1260" y="725" class="label">yes</text>
  <path class="arrow dash" d="M1315 525 C1315 465 792 465 792 805"/><text x="1080" y="487" class="label">no → keep SFT</text>
  <path class="arrow" d="M1290 810 H1305"/>
  <path class="arrow" d="M1420 878 C1420 920 910 920 850 880"/><text x="1160" y="914" class="label">accept yᴅ</text>
  <path class="arrow dash" d="M1535 810 C1570 810 1570 900 850 880"/><text x="1460" y="902" class="label">reject/truncate → yₛ</text>
</svg>
