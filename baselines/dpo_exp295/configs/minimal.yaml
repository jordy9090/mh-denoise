experiment:
  name: dpo_exp295_minimal
  variant: minimal
  base_model: google/gemma-4-E4B-it
  sft_adapter: outputs/models/gemma4_peft_sft_plain_exp295/final
  train_file: data/dpo_exp295/minimal/train.jsonl
  valid_file: data/dpo_exp295/minimal/valid.jsonl
  output_root: outputs/models/dpo_exp295

objective:
  beta: 0.10
  loss_type: sigmoid
  label_smoothing: 0.0

training:
  seed: 42
  data_seed: 42
  max_steps: 234
  learning_rate: 5.0e-6
  warmup_ratio: 0.06
  lr_scheduler_type: cosine
  weight_decay: 0.01
  max_grad_norm: 0.3
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  eval_steps: 26
  save_steps: 26
  logging_steps: 5
  save_total_limit: 2
  max_length: 1152
  allow_truncation: false
  truncation_tolerance: 0.01
  precompute_ref_log_probs: true
  precompute_ref_batch_size: 1
  gradient_checkpointing: true
  bf16: true
  tf32: true
  dataset_num_proc: 1

quantization:
  load_in_4bit: true
  quant_type: nf4
  double_quant: true
  compute_dtype: bfloat16
